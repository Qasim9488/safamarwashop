<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>Premium Party Dress - Details</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #fef1f5; }

        .video-section { margin-top: 5px; }
        .video-container { margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ہوم پیج پر واپس جانے کا بٹن -->
        <a href="discount.html" style="float: left; text-decoration: none; color: #ff007f;">← Back </a>
        <br><br>

        <!-- بڑی تصویر -->
       <div class="products-row" style="display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 20px;">

    <!-- 1. LEFT PRODUCT -->
    <div class="product-item" style="flex: 1; min-width: 200px; text-align: center;">
        <!-- بڑی تصویر -->
        <img src="D1.jpg" alt="Premium Party Dress" class="main-image" style="width: 100%; max-width: 250px; border-radius: 10px;">
       
    </div>

    <!-- 2. CENTER PRODUCT -->
    <div class="product-item" style="flex: 1; min-width: 200px; text-align: center;">

    </div>

    <div class="product-item" style="flex: 1; min-width: 200px; text-align: center;">

    </div>

</div>


        <!-- ویڈیوز لگانے کا سیکشن -->

            <div class="video-container">
                <video width="50%" max-width="50" controls>
                    <source src="DV3.mp4" type="video/mp4">
                    آپ کا براؤزر ویڈیو سپورٹ نہیں کرتا۔
                </video>
            </div>
