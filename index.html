<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safa Marwa Shop | Children Garments & Trendy Products</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        
        /* Contact Info Bar */
        .contact-bar { background-color: #0ba0e0; color: #f8f9fa; text-align: left; padding: 12px; font-size: 20px; }
        .contact-bar a { color: #fcfafa; text-decoration: none; font-weight: bold; margin: 0 12px; }

        /* Top Navigation Header for LOGO */
        header { background-color: white; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .logo-img { max-height: 90px; width: auto; object-fit: contain; }
        
        /* Banner Container Adjustments */
        .banner-container { width: 100%; max-width: 100%; overflow: hidden; display: block; line-height: 0; }
        .banner-img { width: 100%; height: auto; display: block; }
        
        /* Layout Container */
        .container { max-width: 1200px; margin: 45px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 35px; font-size: 32px; color: #2c3e50; font-weight: 700; position: relative; }
        .section-title::after { content: ''; display: block; width: 60px; height: 4px; background: #ff6b81; margin: 10px auto 0; border-radius: 2px; }
        
        /* Products Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        
        /* Product Card Design */
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.06); text-align: center; padding-bottom: 20px; transition: all 0.3s ease; border: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 12px 25px rgba(0,0,0,0.12); }
        .product-img { width: 100%; height: 260px; background-size: cover; background-position: center; }
        
        .product-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-tag { display: inline-block; background: #ffe1e6; color: #ff6b81; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 15px; margin-bottom: 8px; width: max-content; margin-left: auto; margin-right: auto; }
        .product-title { font-size: 17px; margin-bottom: 8px; color: #2c3e50; font-weight: 600; min-height: 48px; }
        .product-price { color: #ff6b81; font-size: 20px; font-weight: 700; margin-bottom: 15px; }
        
        /* Order Button WhatsApp */
        .buy-btn { display: inline-flex; align-items: center; justify-content: center; background-color: #25d366; color: white; text-decoration: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 14px; transition: background 0.3s; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); width: 90%; margin: 0 auto; }
        .buy-btn:hover { background-color: #20ba5a; }
        .buy-btn i { margin-right: 8px; font-style: normal; font-size: 16px; }      
        
   .my-footer {
    text-align: center;
    background-color: #0ba0e0; /* Aap apni pasand ka color laga sakte hain */
    color: white;
    padding: 10px 0;
}

    </style>
</head>
<body>
    
    <!-- Contact Bar -->
   
    <div class="contact-bar">
<nav>
    <a href="index.html">Home</a>

    <a href="discount.html">Discount/Offers</a> 
    <a href="about.html">About us</a>
    <a href="contact.html">Contact</a>
</nav>

    <!-- Header Section with Logo Image -->
    <header>
        <img src="LOGO.jpg" alt="Safa Marwa Shop Logo" class="logo-img" onerror="this.src='logo.jpg'; this.onerror=function(){ this.style.display='none'; this.after('🛍️ 𝕊𝔸𝔽𝔸 𝕄𝔸ℝ𝕎𝔸 ℍ𝔸𝔸𝕁ℝ𝔸'); };">
    </header>

    <!-- Auto-Detecting Banner Section -->
    <div class="banner-container">
        <img src="banner5.png" alt="Safa Marwa Shop Banner" class="banner-img" onerror="this.src='banner.png'; this.onerror=function(){ this.src='image_eNg6fZ.png'; };">
    </div>
