<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safa Marwa Shop | Children Garments & Trendy Products</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }

        body {
    background-image: url('bg-pattern.jpg');
    background-size: auto; /* Kyunki yeh seamless pattern hai, yeh khud ko repeat kar lega */
    background-attachment: fixed; /* Page scroll karne par background apni jagah ruka rahega */
}
      
        
        /* Contact Info Bar */
        .contact-bar { background-color: #0ba0e0; color: #f8f9fa; text-align: left; padding: 12px; font-size: 20px; }
        .contact-bar a { color: #fcfafa; text-decoration: none; font-weight: bold; margin: 0 12px; }

        /* Top Navigation Header for LOGO */
        header { background-color: white; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .logo-img { max-height: 90px; width: auto; object-fit: contain; }
        
        /* Banner Container Adjustments */
        .banner-container { width: 100%; max-width: 100%; overflow: hidden; display: block; line-height: 0; }
        .banner-img { width: 100%; height: auto; display: block; }
        
        /* Layout Container */
        .container { max-width: 1200px; margin: 45px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 35px; font-size: 32px; color: #2c3e50; font-weight: 700; position: relative; }
        .section-title::after { content: ''; display: block; width: 60px; height: 4px; background: #ff6b81; margin: 10px auto 0; border-radius: 2px; }
       <!-- Contact Bar -->
   
    <div class="contact-bar">
<nav>

    <a href="contact.html">Contact</a>
</nav>

    <!-- Header Section with Logo Image -->
    <header>
        <img src="LOGO.jpg" alt="Safa Marwa Shop Logo" class="logo-img" onerror="this.src='logo.jpg'; this.onerror=function(){ this.style.display='none'; this.after('🛍️ 𝕊𝔸𝔽𝔸 𝕄𝔸ℝ𝕎𝔸 ℍ𝔸𝔸𝕁ℝ𝔸'); };">

    <!-- Main Products Display Grid -->
    <div class="products-grid">

        <!-- PRODUCT 1 -->
        <div class="product-card">
            <!-- Apni product picture ka naam 'src' mein likhein -->
            <img src="dress1.jpg" alt="Fancy Party Dress" onerror="this.src='banner5.png';">
            <div class="product-info">
                <div class="product-title">Fancy Party Dress</div>
                <p class="product-desc">Bacchon ke liye nihayat khubsoorat aur comfortable party wear frock. High quality fabric aur pakki silai ke sath.</p>
                <div class="product-footer">
                    <span class="product-price">50 AED</span>
                    <a href="https://wa.me" class="order-btn" target="_blank">Order Now</a>
                </div>
            </div>
        </div>

        <!-- PRODUCT 2 -->
        <div class="product-card">
            <img src="summer.png" alt="Casual Summer T-Shirt" onerror="this.src='banner5.png';">

                <div class="product-title">Casual Summer T-Shirt</div>
                <p class="product-desc">Pure cotton se bani thandi aur narm t-shirt jo garmiyon ke liye behtareen hai. Dhone par rang kharab nahi hoga.</p>
                <div class="product-footer">
                    <span class="product-price">35 AED</span>
                    <a href="https://wa.me" class="order-btn" target="_blank">Order Now</a>
                </div>
            </div>
        </div>

        <!-- PRODUCT 3 -->
        <div class="product-card">
            <img src="jeans.jpg" alt="Kids Denim Jeans" onerror="this.src='banner5.png';">

                <p class="product-desc">Stretchable aur mazboot denim jeans jo bacchon ke rozana pehn'nay aur khelne koodne ke liye aaram-deh hai.</p>
                <div class="product-footer">
                    <span class="product-price">45 AED</span>
                    <a href="https://wa.me" class="order-btn" target="_blank">Order Now</a>
                </div>
            </div>
        </div>
