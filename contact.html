        /* Bada aur Saaf Text */

        .contact-value { font-size: 32px; font-weight: bold; color: #222; text-decoration: none; word-break: break-all; }
        
        /* Interactive Links colors */
        .email-style { color: #0066cc; }
        .whatsapp-style { color: #25d366; }
        .whatsapp-style:hover { color: #1ebd54; }
