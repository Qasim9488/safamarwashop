<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safa Marwa Haajra - Kids Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff5f7 0%, #e6f4fe 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            position: relative;
            background-color: #ffffff;
            border: 8px solid #ffcc00;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 400px;
            height: 400px;
        }

        /* Yahan Aapka Logo Background Me Show Hoga */
        .game-background-logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* APNI TASVEER KA NAAM YA LINK YAHAN NEECHE 'logo.png' KI JAGAH LIKHEIN */
            background-image: url('logo.png'); 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.15; /* Is se logo halka (transparent) rahe ga taake game saaf dikhe */
            pointer-events: none;
            z-index: 0;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            color: #4a90e2;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .score-board span {
            color: #ff6b81;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="score-board">Score: <span id="score">0</span></div>

    <div class="game-container">
        <!-- Logo Layer -->
        <div class="game-background-logo"></div>
        <!-- Game Canvas Layer -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls-hint">Game khelni ke liye Arrow Keys (← ↑ → ↓) ka istemaal karein!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5, type: 0}; 
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;

        // Baccho ke kapre design karne ke liye rang (Logo se matched)
        const garmentColors = ['#ff6b81', '#4a90e2', '#ffcc00'];

        function startGame() {
            resetFood();
            gameInterval = setInterval(updateGame, 150);
        }

        function updateGame() {
            // Snake ka agla kadam
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Deewar ya apni dumm se takrana (Game Over)
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkCollision(head)) {
                clearInterval(gameInterval);
                alert("Game Over! Aapka Score: " + score);
                resetGame();
                return;
            }

            snake.unshift(head);

            // Agar snake kapra (food) kha lay
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                resetFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function checkCollision(head) {
            return snake.some((segment, index) => index !== 0 && segment.x === head.x && segment.y === head.y);
        }

        function resetFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            food.type = Math.floor(Math.random() * garmentColors.length);
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            startGame();
        }

        function draw() {
            // Canvas clear karna (Transparent taake pichay logo dikhta rahe)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Snake banana (Cute Rounded Shapes)
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#4a90e2" : "#5cb85c"; // Head blue, body green
                ctx.beginPath();
                ctx.arc(segment.x * gridSize + gridSize/2, segment.y * gridSize + gridSize/2, gridSize/2 - 1, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Baby Garment Food banana (Choti t-shirt/cap jaisi shape)
            ctx.fillStyle = garmentColors[food.type];
            ctx.fillRect(food.x * gridSize + 4, food.y * gridSize + 6, gridSize - 8, gridSize - 8); // Body
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 4, gridSize - 4, 3); // Sleeves/Top
        }

        // Keys controls
        window.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp": if (dy === 0) { dx = 0; dy = -1; } break;
                case "ArrowDown": if (dy === 0) { dx = 0; dy = 1; } break;
                case "ArrowLeft": if (dx === 0) { dx = -1; dy = 0; } break;
                case "ArrowRight": if (dx === 0) { dx = 1; dy = 0; } break;
            }
        });

        startGame();
    </script>
</body>
</html>
