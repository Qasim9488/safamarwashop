<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safa Marwa Haajra - Kids Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 10px;
            background: linear-gradient(135deg, #fff5f7 0%, #e6f4fe 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .heading {
            color: #4a90e2;
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
        }

        .subheading {
            color: #ff6b81;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .score-board {
            font-size: 22px;
            font-weight: bold;
            color: #4a90e2;
            margin-bottom: 15px;
            background: white;
            padding: 5px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 20px;
        }

        .score-board span {
            color: #ff6b81;
        }

        .item-label {
            color: #ffcc00;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        .game-container {
            position: relative;
            background-color: #ffffff;
            border: 8px solid #ffcc00;
            border-radius: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 400px;
            height: 400px;
        }

        .game-background-logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logo.png'); 
            background-size: 85% auto;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.18; 
            pointer-events: none;
            z-index: 0;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .close-btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
        }

        .coupon-badge {
            background: #ffcc00;
            color: #333;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 20px;
            border: 3px dashed #ff6b81;
            border-radius: 10px;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        /* Mobile Controls UI Layout */
        .mobile-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 8px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .btn {
            width: 55px;
            height: 55px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 10px rgba(74, 144, 226, 0.3);
            cursor: pointer;
        }

        .btn:active {
            background-color: #ff6b81;
        }

        .btn-up { background-color: #ffcc00; color: #333; box-shadow: 0 5px 10px rgba(255, 204, 0, 0.4); }
    </style>
</head>
<body>

    <div class="heading">Safa Marwa Haajra</div>
    <div class="subheading">Child Clothing Online Store</div>

    <div class="score-board">
        <div>Score: <span id="score">0</span></div>
        <div>Catching: <span id="itemLabel" class="item-label">Shirt 👕</span></div>
    </div>

    <div class="game-container">
        <div class="game-background-logo"></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Coupon Discount Popup Window -->
        <div class="overlay" id="couponPopup" style="display: none;">
            <h3 style="color: #4a90e2; margin: 0; font-size: 26px;">🎉 Win! 🎉</h3>
            <p style="color: #5cb85c; font-weight: bold; margin: 5px 0; font-size: 18px;">2000 Points Cleared!</p>
            <div class="coupon-badge">KIDS10</div>
            <p style="color: #ff6b81; font-weight: bold; font-size: 16px; margin: 5px 0 15px 0;">Get 10% OFF on Garments!</p>
            <button class="close-btn" id="closePopupBtn">Resume Game</button>
        </div>
    </div>

    <!-- On-Screen Control Buttons -->
    <div class="mobile-controls">
        <button class="btn btn-up" id="btnUp">↑</button>
        <div class="control-row">
            <button class="btn" id="btnLeft">←</button>
            <button class="btn" id="btnRight">→</button>
        </div>
        <button class="btn" id="btnDown">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const itemLabelElement = document.getElementById("itemLabel");
        const couponPopup = document.getElementById("couponPopup");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        let food = {x: 5, y: 5, productIndex: 0}; 
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let isGameRunning = true;
        let couponAwarded = false;

        // Custom Child Products Data List
        const childProducts = [
            { name: "Shirt 👕", emoji: "👕" },
            { name: "Frock 👗", emoji: "👗" },
            { name: "Socks 🧦", emoji: "🧦" },
            { name: "Cap 🧢", emoji: "🧢" },
            { name: "Shoes 👟", emoji: "👟" }
        ];

        function startGame() {
            resetFood();
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 140); 
        }

        function updateGame() {
            if (!isGameRunning) return;

            // Safe syntax structure using array indexes cleanly
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkCollision(head)) {
                clearInterval(gameInterval);
                alert("Game Over! Aapka Score: " + score + "\nDobara khelne ke liye OK dabayein.");
                resetGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;

                if (score >= 2000 && !couponAwarded) {
                    isGameRunning = false;
                    couponAwarded = true;
                    couponPopup.style.display = "flex";
                }
                resetFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function checkCollision(head) {
            return snake.some((segment, index) => index !== 0 && segment.x === head.x && segment.y === head.y);
        }

        function resetFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            food.productIndex = Math.floor(Math.random() * childProducts.length);
            
            if(snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                resetFood();
            }
            itemLabelElement.innerText = childProducts[food.productIndex].name;
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            couponAwarded = false;
            scoreElement.innerText = score;
            isGameRunning = true;
            startGame();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Snake Segments
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#4a90e2" : "#ff6b81"; 
                ctx.beginPath();
                ctx.arc(segment.x * gridSize + gridSize/2, segment.y * gridSize + gridSize/2, gridSize/2 - 1, 0, 2 * Math.PI);
                ctx.fill();
                
                if(index === 0) {
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(segment.x * gridSize + 6, segment.y * gridSize + 8, 3, 0, 2 * Math.PI);
                    ctx.arc(segment.x * gridSize + 14, segment.y * gridSize + 8, 3, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });
