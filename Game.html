<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safa Marwa Haajra - Kids Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff5f7 0%, #e6f4fe 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            touch-action: manipulation;
        }

        .heading {
            color: #4a90e2;
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
        }

        .subheading {
            color: #ff6b81;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .score-board {
            font-size: 22px;
            font-weight: bold;
            color: #4a90e2;
            margin-bottom: 10px;
            background: white;
            padding: 5px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
        }

        .score-board span {
            color: #ff6b81;
        }

        .item-label {
            color: #ffcc00;
            text-shadow: 1px 1px 1px #00000022;
        }

        .game-container {
            position: relative;
            background-color: #ffffff;
            border: 8px solid #ffcc00;
            border-radius: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 360px;
            height: 360px;
        }

        .game-background-logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logo.png'); 
            background-size: 85% auto;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay Screens (Start & Popup) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .start-btn, .close-btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
            transition: transform 0.2s;
        }

        .start-btn:hover, .close-btn:hover {
            transform: scale(1.05);
        }

        /* Coupon Styling */
        .coupon-title {
            color: #4a90e2;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .coupon-badge {
            background: #ffcc00;
            color: #333;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 20px;
            border: 3px dashed #ff6b81;
            border-radius: 10px;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        /* Mobile Controls Layout */
        .mobile-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            gap: 5px;
            width: 100%;
            max-width: 200px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 25px;
            width: 100%;
        }

        .btn {
            width: 55px;
            height: 55px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 10px rgba(74, 144, 226, 0.3);
            cursor: pointer;
        }

        .btn:active {
            background-color: #ff6b81;
        }

        .btn-up { background-color: #ffcc00; color: #333; box-shadow: 0 5px 10px rgba(255, 204, 0, 0.4); }
    </style>
</head>
<body>

    <div class="heading">Safa Marwa Haajra</div>
    <div class="subheading">Child Clothing Online Store</div>

    <div class="score-board">
        <div>Score: <span id="score">0</span></div>
        <div>Catching: <span id="itemLabel" class="item-label">Shirt 👕</span></div>
    </div>

    <div class="game-container">
        <div class="game-background-logo"></div>
        <canvas id="gameCanvas" width="360" height="360"></canvas>

        <!-- Start Screen Overlay -->
        <div class="overlay" id="startScreen">
            <h2 style="color: #4a90e2; margin-bottom: 20px;">Welcome Kids! 🎈</h2>
            <button class="start-btn" id="startBtn">START GAME</button>
        </div>

        <!-- 10% OFF Coupon Popup Overlay -->
        <div class="overlay" id="couponPopup" style="display: none;">
            <div class="coupon-title">🎉 Amazing! 🎉</div>
            <p style="color: #5cb85c; font-weight: bold; margin: 0;">You scored 2000+ points!</p>
            <p style="color: #7f8c8d; font-size: 14px; margin: 5px 0;">Here is a special gift for your Parents:</p>
            <div class="coupon-badge">KIDS10</div>
            <p style="color: #ff6b81; font-weight: bold; font-size: 15px; margin-bottom: 15px;">Get 10% OFF on Baby Garments!</p>
            <button class="close-btn" id="closePopupBtn">Resume Game</button>
        </div>
    </div>

    <!-- Touch Control Buttons for Mobile Users -->
    <div class="mobile-controls">
        <button class="btn btn-up" id="btnUp">↑</button>
        <div class="control-row">
            <button class="btn" id="btnLeft">←</button>
            <button class="btn" id="btnRight">→</button>
        </div>
        <button class="btn" id="btnDown">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const itemLabelElement = document.getElementById("itemLabel");
        const startScreen = document.getElementById("startScreen");
        const couponPopup = document.getElementById("couponPopup");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        let food = {x: 5, y: 5, productIndex: 0}; 
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let isGameRunning = false;
        let couponAwarded = false;

        const childProducts = [
            { name: "Shirt 👕", emoji: "👕" },
            { name: "Frock 👗", emoji: "👗" },
            { name: "Socks 🧦", emoji: "🧦" },
            { name: "Cap 🧢", emoji: "🧢" },
            { name: "Shoes 👟", emoji: "👟" }
        ];

        function initGame() {
            resetFood();
            draw();
        }

        function startGame() {
            startScreen.style.display = "none";
            isGameRunning = true;
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 150); 
        }

        function updateGame() {
            if (!isGameRunning) return;

            const head = {x: snake.x + dx, y: snake.y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkCollision(head)) {
                clearInterval(gameInterval);
                alert("Game Over! Aapka Score: " + score);
                resetGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;

                // Check for 2000 points coupon milestone
                if (score >= 2000 && !couponAwarded) {
                    showCoupon();
                }

                resetFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function showCoupon() {
            isGameRunning = false; // Game pause karein
            couponAwarded = true;  // Ek game me aik hi dafa popup aaye
            couponPopup.style.display = "flex";
        }

        function checkCollision(head) {
            return snake.some((segment, index) => index !== 0 && segment.x === head.x && segment.y === head.y);
        }

        function resetFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            food.productIndex = Math.floor(Math.random() * childProducts.length);
            
            if(snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                resetFood();
            }
            itemLabelElement.innerText = childProducts[food.productIndex].name;
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            couponAwarded = false;
