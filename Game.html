<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safa Marwa Haajra - Kids Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff5f7 0%, #e6f4fe 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .heading {
            color: #4a90e2;
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
        }

        .subheading {
            color: #ff6b81;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .game-container {
            position: relative;
            background-color: #ffffff;
            border: 8px solid #ffcc00;
            border-radius: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 400px;
            height: 400px;
        }

        /* Background me aapka logo load karne ki jagah */
        .game-background-logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Note: Jab aap ise apni site par lagayein, toh niche 'logo.png' ki jagah apni asli logo image ka link daal dein */
            background-image: url('logo.png'); 
            background-size: 85% auto;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.18; /* Halka rakha hai taake bache aaram se khel sakein */
            pointer-events: none;
            z-index: 0;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .score-board {
            font-size: 26px;
            font-weight: bold;
            color: #4a90e2;
            margin-bottom: 15px;
            background: white;
            padding: 5px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .score-board span {
            color: #ff6b81;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 15px;
            color: #7f8c8d;
            text-align: center;
            font-weight: bold;
            background: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

         
    </style>
</head>
<body>

    <div class="heading">Safa Marwa Haajra</div>
    <div class="subheading">Child Clothing Online Store</div>

    <div class="score-board">Score: <span id="score">0</span></div>

    <div class="game-container">
        <!-- Logo Background Layer -->
        <div class="game-background-logo"></div>
        <!-- Snake Game Canvas Layer -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls-hint">Game khelne ke liye Arrow Keys (← ↑ → ↓) ka istemaal karein!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        let food = {x: 5, y: 5, type: 0}; 
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;

        // Brand colors ke mutabiq baby garments ke rang (Pink, Blue, Yellow)
        const garmentColors = ['#ff6b81', '#4a90e2', '#ffcc00'];

        function startGame() {
            resetFood();
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 140); // Bachon ke liye comfortable speed
        }

        function updateGame() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Deewar ya apni dumm se takrana (Game Over)
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkCollision(head)) {
                clearInterval(gameInterval);
                alert("Game Over! Aapka Score: " + score + "\nDobara khelne ke liye OK dabayein.");
                resetGame();
                return;
            }

            snake.unshift(head);

            // Agar snake kapra (food) kha le
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                resetFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function checkCollision(head) {
            return snake.some((segment, index) => index !== 0 && segment.x === head.x && segment.y === head.y);
        }

        function resetFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            food.type = Math.floor(Math.random() * garmentColors.length);
            
            // Food snake ke upar na aaye
            if(snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                resetFood();
            }
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            startGame();
        }

        function draw() {
            // Clear canvas cleanly to keep background transparent
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Snake banana (Smooth colorful segments)
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#4a90e2" : "#ff6b81"; // Head Blue, Body Pink
                ctx.beginPath();
                ctx.arc(segment.x * gridSize + gridSize/2, segment.y * gridSize + gridSize/2, gridSize/2 - 1, 0, 2 * Math.PI);
                ctx.fill();
                
                // Aankhein sirf head par banengi
                if(index === 0) {
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(segment.x * gridSize + 6, segment.y * gridSize + 8, 3, 0, 2 * Math.PI);
                    ctx.arc(segment.x * gridSize + 14, segment.y * gridSize + 8, 3, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });

            // Baby Garment Food Draw karna (Cute Dress/T-shirt shape)
            ctx.fillStyle = garmentColors[food.type];
            let fx = food.x * gridSize;
            let fy = food.y * gridSize;
            
            // Cute T-shirt/Cap representation
            ctx.fillRect(fx + 4, fy + 6, 12, 10); // Main Body
            ctx.fillRect(fx + 1, fy + 6, 18, 3);  // Sleeves
        }

 

         function changeDirection(direction) {
            if (!isGameRunning) return;
            switch(direction) {
                case 'UP': if (dy === 0) { dx = 0; dy = -1; } break;
                case 'DOWN': if (dy === 0) { dx = 0; dy = 1; } break;
                case 'LEFT': if (dx === 0) { dx = -1; dy = 0; } break;
                case 'RIGHT': if (dx === 0) { dx = 1; dy = 0; } break;
            }
        }

        window.addEventListener("keydown", e => {
            if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();

        startGame();
    </script>
</body>
</html>
