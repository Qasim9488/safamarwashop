<head>
    <meta charset="UTF-8">

    <title>Safa Marwa Haajra - Collections</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fbfbfb;
            color: #333;
        }

        /* Top Navigation Header for LOGO */
        header { background-color: white; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .logo-img { max-height: 90px; width: auto; object-fit: contain; }


        /* Contact Info Bar */
        .contact-bar { background-color: #0ba0e0; color: #f8f9fa; text-align: left; padding: 12px; font-size: 20px; }
        .contact-bar a { color: #fcfafa; text-decoration: none; font-weight: bold; margin: 0 12px; }


        /* Top Notification Banner (English & Urdu Mixed) */
        .promo-banner {
            background: linear-gradient(135deg, #f26299, #f9a3c5);
            color: white;
            text-align: center;
            padding: 12px 10px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .promo-banner span {
            display: inline-block;
            margin: 0 10px;
        }

        /* Main Container */
        .collection-container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .page-title {
            color: #0e03a6; /* Deep Sky Blue matching your logo/navbar */
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .page-subtitle {
            color: #0e03a6;
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* Cards Grid Layout */
        .cards-grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* The Selection Card Style */
        .collection-card {
            background: white;
            border-radius: 20px;
            width: 340px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Card Colors Styling */
        .girls-card {
            border: 4px solid #f26299; /* Cute Pink border */
        }
        .boys-card {
            border: 4px solid #3ca0e7; /* Sky Blue border */
        }

        .collection-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        /* Circle for Icon/Image placement */
        .icon-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .girls-card .icon-circle {
            background-color: #ffeef4;
        }
        .boys-card .icon-circle {
            background-color: #e6f4fe;
        }

        .card-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .girls-card .card-name {
            color: #f26299;
        }
        .boys-card .card-name {
            color: #3ca0e7;
        }

        /* Custom Styled Button Inside Card */
        .shop-btn {
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .girls-card .shop-btn {
            background-color: #f26299;
        }
        .girls-card .shop-btn:hover {
            background-color: #d6497f;
        }

        .boys-card .shop-btn {
            background-color: #3ca0e7;
        }
        .boys-card .shop-btn:hover {
            background-color: #2684cb;
        }

        /* Responsive Setup for Small Screens */
        @media (max-width: 768px) {
            .cards-grid {
                gap: 25px;
            }
            .collection-card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
