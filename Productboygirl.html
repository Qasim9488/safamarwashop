<!-- AQUARIUM ANIMATIONS & STYLES                                      -->
<!-- ================================================================= -->
<style>
/* Seaweed Swaying Effect */
@keyframes seaweedSway {
    0%, 100% { transform: rotate(0deg) skewX(0deg); }
    50% { transform: rotate(6deg) skewX(4deg); }
}

/* Fin Wiggling Animation */
@keyframes finWiggle {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(15deg); }
}

/* Fish Swimming Left to Right */
@keyframes swimLeftToRight {
    0% { left: -90px; transform: scaleX(1) translateY(0px); }
    30% { translateY(-15px); }
    70% { translateY(15px); }
    100% { left: 105%; transform: scaleX(1) translateY(0px); }
}

/* Fish Swimming Right to Left */
@keyframes swimRightToLeft {
    0% { right: -90px; transform: scaleX(1) translateY(0px); }
    40% { translateY(20px); }
    80% { translateY(-10px); }
    100% { right: 105%; transform: scaleX(1) translateY(0px); }
}

/* Bubbles Floating Upwards */
@keyframes bubbleRise {
    0% { transform: translateY(450px) translateX(0px); opacity: 0; scale: 0.6; }
    10% { opacity: 0.7; }
    50% { translateX(15px); }
    90% { opacity: 0.4; }
    100% { transform: translateY(-50px) translateX(-10px); opacity: 0; scale: 1.3; }
}
</style>

<!-- JAVASCRIPT FOR REALISTIC DYNAMIC BUBBLES                          -->
<!-- ================================================================= -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const container = document.getElementById("bubbles-container");
    const totalBubbles = 15; // Tank mein lagatar chalne wale bulbulon ki tadad

    for (let i = 0; i < totalBubbles; i++) {
        let bubble = document.createElement("span");
        
        // Random placement and sizes for absolute realism
        let size = Math.random() * 8 + 4; // 4px to 12px random sizes
        let randomLeft = Math.random() * 90 + 5; // 5% to 95% width allocation
        let duration = Math.random() * 5 + 4; // 4s to 9s float speeds
        let delay = Math.random() * 6; // Staggered entry

        bubble.style.cssText = `
            position: absolute;
            bottom: -20px;
            left: ${randomLeft}%;
            width: ${size}px;
            height: ${size}px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.8);
            animation: bubbleRise ${duration}s infinite linear;
            animation-delay: ${delay}s;
        `;
        container.appendChild(bubble);
    }
});
</script>
