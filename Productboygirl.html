<!-- AQUARIUM ANIMATIONS & STYLES                                      -->
<!-- ================================================================= -->
<style>
/* Seaweed Swaying Effect */
@keyframes seaweedSway {
    0%, 100% { transform: rotate(0deg) skewX(0deg); }
    50% { transform: rotate(5deg) skewX(3deg); }
}

/* Fin Wiggling Animation */
@keyframes finWiggle {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(12deg); }
}

/* Fish Swimming Left to Right (Face stays forward) */
@keyframes swimLeftToRight {
    0% { left: -90px; transform: scaleX(1) translateY(0px); }
    50% { translateY(-15px); }
    100% { left: 105%; transform: scaleX(1) translateY(0px); }
}

/* Fish Swimming Right to Left (Flipped perfectly so it does not swim backwards) */
@keyframes swimRightToLeft {
    0% { right: -90px; transform: scaleX(-1) translateY(0px); }
    50% { translateY(15px); }
    100% { right: 105%; transform: scaleX(-1) translateY(0px); }
}

/* Bubbles Floating Upwards */
@keyframes bubbleRise {
    0% { transform: translateY(450px) translateX(0px); opacity: 0; scale: 0.6; }
    10% { opacity: 0.6; }
    50% { translateX(10px); }
    90% { opacity: 0.4; }
    100% { transform: translateY(-50px) translateX(-5px); opacity: 0; scale: 1.2; }
}
</style>

<!-- ================================================================= -->
<!-- JAVASCRIPT FOR REALISTIC DYNAMIC BUBBLES                          -->
<!-- ================================================================= -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const container = document.getElementById("bubbles-container");
    const totalBubbles = 20;

    for (let i = 0; i < totalBubbles; i++) {
        let bubble = document.createElement("span");
        let size = Math.random() * 6 + 3; 
        let randomLeft = Math.random() * 90 + 5; 
        let duration = Math.random() * 4 + 4; 
        let delay = Math.random() * 5; 

        bubble.style.cssText = `
            position: absolute;
            bottom: -20px;
            left: ${randomLeft}%;
            width: ${size}px;
            height: ${size}px;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.6);
            animation: bubbleRise ${duration}s infinite linear;
            animation-delay: ${delay}s;
        `;
        container.appendChild(bubble);
    }
});
</script>
